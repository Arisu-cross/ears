# 构建 ears 的第二阶段镜像（带 ONNX 声纹/环境声）并推到 GitHub 自带的镜像仓库。
#
# 为什么要有这个：ears2 在 Zeabur 是「预构建镜像」部署的，改了源码不会自动生效，
# 必须重新 build 一个镜像推上去、再让 Zeabur 换 tag。以前是在本机手工 docker build。
#
# 推的目标是 ghcr.io（GitHub 自带的镜像仓库），不是 Docker Hub——
# 因为 ghcr 用的是 Actions 自动注入的 GITHUB_TOKEN，**不需要配任何密钥**。
# Docker Hub 那条路要自己去生成 access token 再填进仓库 secret，多一道手续，
# 而且多一个地方存凭据。这里能不碰就不碰。
#
# 出来的镜像叫：ghcr.io/<仓库owner>/ears:<你填的tag>
#
# 跑完之后到 Zeabur 换 tag（service id 见私有手册 ob-backup/SYSTEM-HANDBOOK.md §2）：
#   zeabur service update tag --id <ears2 的 service id> --env-id <env id> -t <这次的 tag>

name: build-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag（例：v0.4-memfix）"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 推 ghcr 就靠这个权限，不用额外密钥
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}    # Actions 自动给的，不用手配

      - name: 镜像名转小写
        id: name
        # ghcr 只认全小写的镜像名，而 owner 是 Arisu-cross（带大写）
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/ears" >> "$GITHUB_OUTPUT"

      - name: build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # WITH_ONNX=1 才会装 onnxruntime 并下载两个模型（见 Dockerfile 第二阶段）。
          # 不加这个的话构建出来的是轻量版，声纹和环境声会静默关闭。
          build-args: WITH_ONNX=1
          tags: ${{ steps.name.outputs.image }}:${{ inputs.tag }}
          # 服务器是 amd64（Tencent Singapore），别让 buildx 顺手出别的架构
          platforms: linux/amd64

      - name: 打印结果
        run: echo "推好了：${{ steps.name.outputs.image }}:${{ inputs.tag }}"
